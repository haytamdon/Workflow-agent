services:
  app:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      RUNTIME_ENV: ${RUNTIME_ENV:-dev}
      AGENTOS_URL: ${AGENTOS_URL:-http://localhost:8000}
      DB_DRIVER: ${DB_DRIVER:-postgresql+psycopg}
      DB_USER: ${DB_USER:-workflow}
      DB_PASS: ${DB_PASS:-workflow}
      DB_HOST: ${DB_HOST:-postgresdb}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-workflow_agent}
      N8N_BASE_URL: ${N8N_INTERNAL_BASE_URL:-http://n8n:5678}
      N8N_API_URL: ${N8N_INTERNAL_API_URL:-http://n8n:5678/api/v1}
      N8N_API_KEY: ${N8N_API_KEY:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openrouter}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-2.5-flash}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgresdb:
        condition: service_healthy

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:latest}
    env_file:
      - .env
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgresdb
      DB_POSTGRESDB_PORT: ${N8N_DB_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${N8N_DB_DATABASE:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASS:-n8n}
      DB_POSTGRESDB_SCHEMA: ${N8N_DB_SCHEMA:-public}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_PUBLIC_API_DISABLED: ${N8N_PUBLIC_API_DISABLED:-false}
      N8N_PUBLIC_API_SWAGGERUI_DISABLED: ${N8N_PUBLIC_API_SWAGGERUI_DISABLED:-false}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      N8N_API_KEY: ${N8N_API_KEY:-}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Africa/Casablanca}
      TZ: ${TZ:-Africa/Casablanca}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgresdb:
        condition: service_healthy

  postgresdb:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-workflow}
      POSTGRES_PASSWORD: ${DB_PASS:-workflow}
      POSTGRES_DB: ${DB_DATABASE:-workflow_agent}
      N8N_DB_USER: ${N8N_DB_USER:-n8n}
      N8N_DB_PASS: ${N8N_DB_PASS:-n8n}
      N8N_DB_DATABASE: ${N8N_DB_DATABASE:-n8n}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_AGENTOS_BASE_URL=${VITE_AGENTOS_BASE_URL:-http://localhost:8000}
      - VITE_N8N_BASE_URL=${VITE_N8N_BASE_URL:-http://localhost:5678}
    depends_on:
      - app

volumes:
  n8n_data:
  postgres_data:
